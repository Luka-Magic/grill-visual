<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grill</title>
<meta name="description" content="grill の質問票の一覧。題材を選ぶと、右に質問票が開きます。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · checked: 2026-11-27 · genre: modern-minimal (inferred: a working tool) · scope: app
 * floor: fixed 26a 27 34 40 48 63 64 73 · waive 39b: the state count and its label are two lines by design · waive 3: the 3px edge marks the open item, a live selection
 * built: the project · redesign: polish · v2.0.0 */
:root {
  --bg: #1c1a17; --panel: #24221e; --side: #201e1b; --line: #3a3730; --line2: #2e2b26;
  --text: #ebe6dc; --sub: #b0a99b; --mute: #9a9487;
  --accent: #e27a52; --on-accent: #1c1a17; --sel-bg: rgba(226, 122, 82, 0.13); --hover: #2b2924; --input: #191714; --err: #f08a7a;
  --s-wait: #95b283; --s-review: #93b6cc; --s-done: #e0736b;
  --field-line: #7a7468; --focus: #e27a52; --scrim: rgba(12, 11, 9, 0.6);
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  --mono: "IBM Plex Mono", "Consolas", "Menlo", monospace;
  --side-w: 304px; --top-h: 44px;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow-x: clip; }
body {
  background: var(--bg); color: var(--text); line-height: 1.5; font-size: 14px; font-family: var(--sans);
  display: flex; flex-direction: row; height: 100dvh; overflow-y: hidden;
}
.mono { font-family: var(--mono); }
button, input, select { font: inherit; color: inherit; }
:where(button, a, input, select, textarea, iframe, [tabindex]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { cursor: not-allowed; color: var(--mute); }
.waiting { color: var(--s-wait); } .answered { color: var(--s-review); } .done { color: var(--s-done); } .error { color: var(--err); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* ---- サイドバー ---- */
#side {
  width: var(--side-w); flex: 0 0 var(--side-w); display: flex; flex-direction: column;
  background: var(--side); border-right: 1px solid var(--line); min-height: 0;
}
.side-top { padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; }
.brand b { font-weight: 600; font-size: 15px; }
.brand small { color: var(--mute); font-size: 12px; margin-left: 8px; }
.brand .time { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--mute); }
.inp { width: 100%; background: var(--input); border: 1px solid var(--field-line); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--text); min-width: 0; }
.inp:focus { border-color: var(--accent); }
.inp::placeholder { color: var(--mute); }
.row { display: flex; gap: 8px; }
.row select { flex: 1; padding: 8px 8px; font-size: 12.5px; }
.row input { width: 7em; flex: 0 0 auto; padding: 8px 8px; font-size: 12.5px; }
.lab { font-size: 11.5px; font-weight: 600; color: var(--sub); margin-bottom: 8px; }
.states { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.states .chip {
  display: flex; flex-direction: column; gap: 2px; align-items: flex-start; border: 0; border-left: 1px solid var(--line);
  background: none; padding: 8px 12px; cursor: pointer; text-align: left; border-radius: 0;
}
.states .chip:first-child { border-left: 0; }
.states .chip:hover { background: var(--hover); }
.states .chip.on { background: var(--sel-bg); }
.states .n { font-family: var(--mono); font-size: 20px; font-weight: 600; line-height: 1.2; }
.states .l { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text); white-space: nowrap; }
.kinds { display: flex; gap: 8px; flex-wrap: wrap; }
.kinds .chip { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--sub); background: none; cursor: pointer; }
.kinds .chip:hover { color: var(--text); background: var(--hover); }
.kinds .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

#list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 8px 12px; border-top: 1px solid var(--line); }
.grp { display: flex; align-items: center; gap: 8px; padding: 12px 8px 4px; font-size: 12px; font-weight: 600; color: var(--sub); }
.grp .c { font-weight: 400; font-variant-numeric: tabular-nums; color: var(--mute); }
.it { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-left: 3px solid transparent; border-radius: 0 6px 6px 0; cursor: pointer; }
.it:hover { background: var(--hover); }
.it:focus-visible { outline-offset: -2px; }
.it.active { border-left-color: var(--accent); background: var(--sel-bg); }
.it.archived { opacity: 0.55; }
.it .h { display: flex; gap: 8px; align-items: flex-start; }
.it .title { flex: 1; font-size: 13.5px; font-weight: 500; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.new { font-size: 11px; font-weight: 600; color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 0 8px; line-height: 1.7; flex: none; }
.ago { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--mute); white-space: nowrap; flex: none; padding-top: 2px; }
.it .meta { display: flex; gap: 12px; font-size: 11.5px; color: var(--mute); overflow: hidden; white-space: nowrap; }
.meta span { overflow: hidden; text-overflow: ellipsis; }
#list .none { padding: 20px 16px; color: var(--mute); font-size: 13px; text-align: center; }
.archbtn { display: flex; justify-content: space-between; font-size: 12px; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--sub); cursor: pointer; }
.archbtn:hover { color: var(--text); background: var(--hover); }
.archbtn[hidden] { display: none; }
#side-foot { padding: 8px 16px; font-size: 11.5px; color: var(--err); border-top: 1px solid var(--line); }
#side-foot:empty { display: none; }

/* ---- 右ペイン ---- */
#pane { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; padding: 0 24px; height: 50px; flex: 0 0 50px; border-bottom: 1px solid var(--line); background: var(--side); font-size: 12px; }
.bar .st { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.bar .st:empty { display: none; }
.bar .m { display: flex; gap: 12px; color: var(--sub); overflow: hidden; white-space: nowrap; }
.bar .t { margin-left: auto; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--mute); white-space: nowrap; }
.bar .arch { font-size: 11.5px; color: var(--mute); background: none; border: 1px solid transparent; border-radius: 4px; padding: 1px 8px; cursor: pointer; white-space: nowrap; }
.bar .arch:hover { color: var(--text); border-color: var(--line); }
.bar .arch[hidden] { display: none; }
#notice { display: flex; gap: 12px; align-items: center; padding: 8px 24px; font-size: 13px; background: var(--sel-bg); border-bottom: 1px solid var(--line); }
#notice[hidden] { display: none; }
#notice span { flex: 1; }
.btn { font-size: 12.5px; border-radius: 6px; padding: 4px 16px; cursor: pointer; border: 0; background: none; color: var(--sub); white-space: nowrap; }
.btn:hover { color: var(--text); }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { color: var(--on-accent); opacity: 0.9; }
.frame-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; position: relative; }
#frame { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
#frame:focus, #frame:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--bg); }
#empty[hidden] { display: none; }
.empty-inner { max-width: 520px; color: var(--sub); font-size: 13.5px; text-align: center; line-height: 1.8; }
.empty-inner h2 { color: var(--text); font-size: 17px; font-weight: 600; margin-bottom: 8px; text-wrap: balance; }
.empty-inner .file { font-family: var(--mono); color: var(--sub); margin-bottom: 8px; }
.empty-inner .file:empty { display: none; }

/* ---- モバイル ---- */
#topbar { display: none; }
#scrim { display: none; }
@media (max-width: 860px) {
  body { flex-direction: column; }
  #topbar { display: flex; align-items: center; gap: 12px; height: var(--top-h); flex: 0 0 var(--top-h); padding: 0 12px; background: var(--side); border-bottom: 1px solid var(--line); }
  #menu { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  #menu .mono { font-size: 12px; color: var(--sub); }
  #top-title { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #side { position: fixed; top: var(--top-h); bottom: 0; left: 0; width: min(88vw, var(--side-w)); transform: translateX(-100%); transition: transform 0.18s, visibility 0.18s; z-index: 30; }
  .js body:not(.drawer-open) #side { visibility: hidden; }
  body.drawer-open #side { transform: none; }
  body.drawer-open #scrim { display: block; position: fixed; inset: var(--top-h) 0 0 0; background: var(--scrim); z-index: 20; }
  .bar { padding: 0 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="topbar">
  <button id="menu" type="button" aria-label="一覧を開く">☰ <span id="top-count" class="mono">回答待ち 0</span></button>
  <span id="top-title"></span>
</div>

<aside id="side">
  <div class="side-top">
    <div class="brand"><span><b>grill</b><small>質問票</small></span><span class="time" id="side-time"></span></div>
    <input id="q" class="inp" type="search" placeholder="タイトル・topic で検索" autocomplete="off">
    <div class="row">
      <select id="project" class="inp"><option value="">プロジェクト: すべて</option></select>
      <input id="issue" class="inp" type="number" min="0" placeholder="#issue">
    </div>
    <div>
      <div class="lab">状態</div>
      <div class="states" data-filter="state">
        <button type="button" class="chip" data-v="waiting"><span class="n waiting" id="c-waiting">0</span><span class="l">回答待ち</span></button>
        <button type="button" class="chip" data-v="answered"><span class="n answered" id="c-answered">0</span><span class="l">AI精査中</span></button>
        <button type="button" class="chip" data-v="done"><span class="n done" id="c-done">0</span><span class="l">完了</span></button>
      </div>
    </div>
    <div>
      <div class="lab">種類</div>
      <div class="kinds" data-filter="kind" id="kinds"></div>
    </div>
  </div>
  <div id="list"></div>
  <button type="button" class="archbtn" id="arch-toggle" hidden><span id="arch-count"></span><span id="arch-action"></span></button>
  <div id="side-foot"></div>
</aside>

<main id="pane">
  <div class="bar"><span class="st" id="top-state"></span><span class="m" id="top-meta">質問票を選んでください</span><span class="t" id="top-time"></span><button type="button" class="arch" id="top-arch" hidden></button></div>
  <div id="notice" hidden>
    <span id="notice-text">AI が質問票を更新しました。入力中の内容は下書きに残ります。</span>
    <button type="button" class="btn primary" id="reload">再読み込み</button>
    <button type="button" class="btn" id="dismiss">あとで</button>
  </div>
  <div class="frame-wrap">
    <div id="empty">
      <div class="empty-inner">
        <h2>質問票を選んでください</h2>
        <div class="file"></div>
        <p>左の一覧から選ぶと、ここにそのまま表示されます。URL は #topic で共有できます。</p>
      </div>
    </div>
    <iframe id="frame" title="質問票"></iframe>
  </div>
</main>
<div id="scrim"></div>
<script>
  document.documentElement.classList.add("js");
(function () {
  "use strict";
  var POLL_MS = 3000;
  var TOPIC_RE = /^[A-Za-z0-9_-]{1,80}$/;
  var STORAGE_KEY = "grill-dashboard.filters";
  var STATES = ["waiting", "answered", "done"];
  var STATE_RANK = { waiting: 0, error: 0, answered: 1, done: 2 };
  var STATE_LABEL = { waiting: "回答待ち", answered: "AI精査中", done: "完了", error: "読めない" };
  var UNSORTED_LABEL = "未分類";  // kind が無い題材。種類の意味はこのページでは決めない(出す側のスキルが宣言する)

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    list: $("list"), frame: $("frame"), empty: $("empty"), notice: $("notice"),
    project: $("project"), issue: $("issue"), q: $("q"), kinds: $("kinds"),
    foot: $("side-foot"), sideTime: $("side-time"), archToggle: $("arch-toggle"), archCount: $("arch-count"), archAction: $("arch-action"),
    topTitle: $("top-title"), topCount: $("top-count"), topState: $("top-state"), topMeta: $("top-meta"), topTime: $("top-time"), topArch: $("top-arch")
  };

  var topics = [];          // /api/state の topics
  var lastText = "";        // 直前のレスポンス本文(同じなら DOM を触らない)
  var lastGeneratedAt = "";
  var current = null;       // 選択中の topic
  var frameStarted = false; // iframe に一度でも src を入れたか
  var loadedVersion = {};   // topic → iframe に読み込んだ version(データ JSON の mtime)
  var pendingSubmit = {};   // topic → iframe から「送信した」と聞いた round
  var fresh = {};           // 新たに待ちになった topic(クリックするまで印を付ける)
  var fetchGeneration = 0;  // 並行した /api/state の応答のうち最新のものだけを採用する
  var filters = loadFilters();

  // ---------------------------------------------------------------- フィルタの保存
  function defaultFilters() {
    return { state: STATES.slice(), kindOff: [],  // kindOff = 隠す種類(新しい種類は自動で表示)
             project: "", issue: "", q: "", archived: false };
  }
  function loadFilters() {
    var base = defaultFilters();
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (saved && typeof saved === "object") {
        Object.keys(base).forEach(function (k) {
          if (!(k in saved)) return;
          var v = saved[k], want = base[k];
          if (Array.isArray(want)) { if (Array.isArray(v)) base[k] = v.filter(function (x) { return typeof x === "string"; }); }
          else if (typeof v === typeof want) base[k] = v;
        });
      }
    } catch (e) { /* 壊れていれば既定値 */ }
    if (base.state.length === 0) base.state = STATES.slice();
    return base;
  }
  function saveFilters() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(filters)); } catch (e) { /* 保存できなくても動く */ }
  }
  function soloState() { return filters.state.length === 1 ? filters.state[0] : null; }
  function applyFilterUi() {
    document.querySelectorAll(".states .chip").forEach(function (chip) {
      chip.classList.toggle("on", chip.getAttribute("data-v") === soloState());
    });
    els.q.value = filters.q;
    els.issue.value = filters.issue;
  }

  // ---------------------------------------------------------------- 一覧
  function byTopic(list) {
    var map = Object.create(null);  // "__proto__" のような topic でも安全
    list.forEach(function (t) { map[t.topic] = t; });
    return map;
  }
  function sanitizeTopics(list) {
    // サーバー側でも弾いているが、URL や DOM に使う前にもう一度確かめる
    return list.filter(function (t) { return t && typeof t.topic === "string" && TOPIC_RE.test(t.topic); });
  }
  function stateKey(t) { return t.state === "error" ? "waiting" : t.state; }  // 読めないものは待ち扱いで見せる
  function visible(t) {
    if (t.archived && !filters.archived) return false;
    if (filters.state.indexOf(stateKey(t)) < 0) return false;
    if (filters.kindOff.indexOf(t.kind || "") >= 0) return false;
    if (filters.project && (t.project || "") !== filters.project) return false;
    if (filters.issue !== "" && String(t.issue) !== String(filters.issue)) return false;
    if (filters.q) {
      var hay = (t.title + " " + t.topic).toLowerCase();
      if (hay.indexOf(filters.q.toLowerCase()) < 0) return false;
    }
    return true;
  }
  function compare(a, b) {
    var r = STATE_RANK[a.state] - STATE_RANK[b.state];
    if (r !== 0) return r;
    return a.updated_at < b.updated_at ? 1 : a.updated_at > b.updated_at ? -1 : 0;
  }
  function shortTime(iso) {
    // "2026-09-27T01:02:03" → "09/27 01:02"
    return iso ? iso.slice(5, 10).replace("-", "/") + " " + iso.slice(11, 16) : "";
  }
  function ago(iso) {
    // 一覧用の相対時刻。1 日より前は日付
    if (!iso) return "";
    var ms = Date.now() - new Date(iso).getTime();
    if (isNaN(ms)) return shortTime(iso);
    var m = Math.floor(ms / 60000);
    if (m < 1) return "今";
    if (m < 60) return m + "分前";
    if (m < 1440) return Math.floor(m / 60) + "時間前";
    return iso.slice(5, 10).replace("-", "/");
  }
  function metaParts(t) {
    var parts = [t.kind || UNSORTED_LABEL];
    if (t.project) parts.push(t.project);
    if (t.issue !== null && t.issue !== undefined) parts.push("#" + t.issue);
    if (t.open_round !== null && t.open_round !== undefined) parts.push("ラウンド " + t.open_round);
    return parts;
  }
  function fillMeta(node, t) {
    // 区切り文字でつながず、項目ごとの span を間隔で並べる
    node.replaceChildren.apply(node, metaParts(t).map(function (s) { return el("span", "", s); }));
    return node;
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function renderItem(t) {
    var it = el("div", "it");
    it.setAttribute("data-topic", t.topic);
    if (t.topic === current) it.classList.add("active");
    if (t.archived) it.classList.add("archived");
    var head = el("div", "h");
    head.appendChild(el("span", "title", t.title || t.topic));
    if (fresh[t.topic]) head.appendChild(el("span", "new", "新着"));
    head.appendChild(el("span", "ago", ago(t.updated_at)));
    it.appendChild(head);
    var meta = fillMeta(el("div", "meta"), t);
    if (t.error) meta.title = t.error;
    it.appendChild(meta);
    it.tabIndex = 0;
    it.setAttribute("role", "button");
    it.addEventListener("click", function () { select(t.topic); });
    it.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(t.topic); }
    });
    return it;
  }
  function renderGroup(state, items) {
    var grp = el("div", "grp");
    grp.appendChild(el("span", state, STATE_LABEL[state]));
    grp.appendChild(el("span", "c", String(items.length)));
    return grp;
  }
  function renderList() {
    var shown = topics.filter(visible).sort(compare);
    var frag = document.createDocumentFragment();
    if (shown.length === 0) frag.appendChild(el("div", "none", "該当する質問票はありません"));
    STATES.forEach(function (state) {
      var items = shown.filter(function (t) { return stateKey(t) === state; });
      if (items.length === 0) return;
      frag.appendChild(renderGroup(state, items));
      items.forEach(function (t) { frag.appendChild(renderItem(t)); });
    });
    els.list.replaceChildren(frag);
    var archived = topics.filter(function (t) { return t.archived; }).length;
    els.archToggle.hidden = archived === 0;
    els.archCount.textContent = "アーカイブ済み " + archived + " 件";
    els.archAction.textContent = filters.archived ? "隠す" : "表示";
  }
  function renderKinds() {
    // プロジェクトを選んでいるときは、そのプロジェクトにある種類だけ出す
    var seen = {};
    topics.forEach(function (t) {
      if (filters.project && (t.project || "") !== filters.project) return;
      seen[t.kind || ""] = true;
    });
    var names = Object.keys(seen).sort(function (a, b) {
      if (a === "" || b === "") return a === "" ? 1 : -1;  // 未分類は最後
      return a.localeCompare(b, "ja");
    });
    var frag = document.createDocumentFragment();
    names.forEach(function (n) {
      var chip = el("button", "chip", n || UNSORTED_LABEL);
      chip.type = "button";
      chip.setAttribute("data-v", n);
      chip.classList.toggle("on", filters.kindOff.indexOf(n) < 0);
      frag.appendChild(chip);
    });
    els.kinds.replaceChildren(frag);
  }
  function renderProjects() {
    var seen = {};
    topics.forEach(function (t) { if (t.project) seen[t.project] = true; });
    var names = Object.keys(seen).sort();
    var frag = document.createDocumentFragment();
    frag.appendChild(new Option("プロジェクト: すべて", ""));
    names.forEach(function (n) { frag.appendChild(new Option(n, n)); });
    els.project.replaceChildren(frag);
    els.project.value = names.indexOf(filters.project) >= 0 ? filters.project : "";
  }
  function renderCounts(counts) {
    STATES.forEach(function (k) { $("c-" + k).textContent = counts[k] || 0; });
    var waiting = counts.waiting || 0;
    document.title = waiting ? "[回答待ち " + waiting + "] Grill" : "Grill";
    els.topCount.textContent = "回答待ち " + waiting;
    els.sideTime.textContent = lastGeneratedAt ? lastGeneratedAt.slice(11, 16) + " 更新" : "";
    els.foot.textContent = counts.error ? "読めないファイル " + counts.error + " 件" : "";
  }
  function renderTopBar(t) {
    els.topState.textContent = "";
    if (t) {
      els.topState.className = "st " + t.state;
      els.topState.appendChild(document.createTextNode(STATE_LABEL[t.state] || t.state));
      fillMeta(els.topMeta, t);
      els.topTime.textContent = t.updated_at ? shortTime(t.updated_at) + " 更新" : "";
      els.topArch.hidden = false;
      els.topArch.textContent = t.archived ? "一覧に戻す" : "アーカイブ";
    } else {
      els.topMeta.textContent = current ? current : "質問票を選んでください";
      els.topTime.textContent = "";
      els.topArch.hidden = true;
    }
  }

  // ---------------------------------------------------------------- 状態の取得
  function fetchState() {
    var generation = ++fetchGeneration;
    return fetch("/api/state", { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).then(function (text) {
      if (generation !== fetchGeneration) return;  // もっと新しい要求が出ている。古い応答は捨てる
      if (text === lastText) return;
      var doc = JSON.parse(text);
      lastText = text;
      var prev = byTopic(topics);
      topics = sanitizeTopics(doc.topics || []);
      lastGeneratedAt = doc.generated_at || "";
      pruneMaps();
      markFresh(prev);
      renderCounts(doc.counts || {});
      renderKinds();
      renderProjects();
      renderList();
      syncFrame(prev);
    }).catch(function (e) {
      els.foot.textContent = "取得失敗: " + e.message;
    });
  }
  function pruneMaps() {
    var live = byTopic(topics);
    [pendingSubmit, fresh, loadedVersion].forEach(function (map) {
      Object.keys(map).forEach(function (k) { if (!(k in live)) delete map[k]; });
    });
  }
  function markFresh(prev) {
    topics.forEach(function (t) {
      var p = prev[t.topic];
      if (t.state === "waiting" && p && p.state !== "waiting" && t.topic !== current) fresh[t.topic] = true;
    });
  }

  // ---------------------------------------------------------------- iframe
  function showEmpty(title, file, body) {
    els.empty.querySelector("h2").textContent = title;
    els.empty.querySelector(".file").textContent = file;
    els.empty.querySelector("p").textContent = body;
    els.empty.hidden = false;
  }
  function frameUrl(t) {
    return "/grill-" + t.topic + ".html?v=" + encodeURIComponent(t.version || "");
  }
  function loadFrame(t) {
    els.notice.hidden = true;
    els.topTitle.textContent = t ? (t.title || t.topic) : (current || "");
    renderTopBar(t);
    if (!t) { showEmpty("見つかりません", "", "この topic の質問票データはまだありません。"); return; }
    if (t.state === "error") { showEmpty("読めません", "", t.error || "JSON が壊れています。AI が書き換え中かもしれません。"); return; }
    if (!t.html_exists) {
      showEmpty("まだレンダーされていません", "grill-" + t.topic + ".html",
                "データはありますが、質問票の HTML がまだありません。AI が render.py を実行すると、ここに表示されます。");
      return;
    }
    els.empty.hidden = true;
    var url = frameUrl(t);
    if (!frameStarted) { els.frame.src = url; frameStarted = true; }
    else { try { els.frame.contentWindow.location.replace(url); } catch (e) { els.frame.src = url; } }
    loadedVersion[t.topic] = t.version;
  }
  function syncFrame(prev) {
    if (!current) return;
    var t = byTopic(topics)[current];
    if (!t) { if (loadedVersion[current] !== undefined || !els.empty.hidden) loadFrame(undefined); return; }
    renderTopBar(t);
    if (loadedVersion[current] === undefined) { loadFrame(t); return; }  // 初回(データが来る前に hash があった)
    if (t.version === loadedVersion[current]) return;  // 回答ファイルが出ただけでは version は変わらない
    var p = prev[current];
    var becameWaiting = p && p.state !== "waiting" && t.state === "waiting";
    if (pendingSubmit[current] !== undefined || becameWaiting) {
      delete pendingSubmit[current];
      loadFrame(t);
    } else {
      els.notice.hidden = false;
    }
  }
  function select(topic) {
    if (location.hash.slice(1) !== topic) history.replaceState(null, "", "#" + topic);  // 履歴を積まない
    onHashChange();
  }
  function onHashChange() {
    document.body.classList.remove("drawer-open");
    var topic = decodeURIComponent(location.hash.slice(1));
    if (!TOPIC_RE.test(topic)) {
      current = null;
      renderTopBar(null);
      showEmpty("質問票を選んでください", "", "左の一覧から選ぶと、ここにそのまま表示されます。URL は #topic で共有できます。");
      return;
    }
    current = topic;
    delete fresh[topic];
    els.topTitle.textContent = topic;
    var t = byTopic(topics)[topic];
    if (!lastText) return;  // 初回取得を待つ(syncFrame が読み込む)
    loadFrame(t);
    renderList();
  }

  // ---------------------------------------------------------------- 操作
  document.querySelector(".states").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    var v = chip.getAttribute("data-v");
    filters.state = soloState() === v ? STATES.slice() : [v];  // 押すとその状態だけ。もう一度で全部
    saveFilters(); applyFilterUi(); renderList();
  });
  els.kinds.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    var v = chip.getAttribute("data-v");
    var idx = filters.kindOff.indexOf(v);  // 種類チップは「隠す側」の一覧を持つ
    filters.kindOff = idx >= 0 ? filters.kindOff.filter(function (x) { return x !== v; }) : filters.kindOff.concat([v]);
    saveFilters(); renderKinds(); renderList();
  });
  els.q.addEventListener("input", function () { filters.q = els.q.value.trim(); saveFilters(); renderList(); });
  els.issue.addEventListener("input", function () { filters.issue = els.issue.value.trim(); saveFilters(); renderList(); });
  els.project.addEventListener("change", function () { filters.project = els.project.value; saveFilters(); renderKinds(); renderList(); });
  els.archToggle.addEventListener("click", function () { filters.archived = !filters.archived; saveFilters(); renderList(); });
  els.topArch.addEventListener("click", function () {
    var t = byTopic(topics)[current];
    if (t) toggleArchive(t.topic, !t.archived);
  });
  function toggleArchive(topic, archived) {
    fetch("/api/archive", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: topic, archived: archived })
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      lastText = "";
      return fetchState();
    }).catch(function (e) { alert("アーカイブの保存に失敗: " + e.message); });
  }
  $("reload").addEventListener("click", function () { var t = byTopic(topics)[current]; if (t) loadFrame(t); });
  $("dismiss").addEventListener("click", function () { els.notice.hidden = true; });
  $("menu").addEventListener("click", function () { document.body.classList.toggle("drawer-open"); });
  $("scrim").addEventListener("click", function () { document.body.classList.remove("drawer-open"); });

  window.addEventListener("hashchange", onHashChange);
  window.addEventListener("message", function (e) {
    if (e.origin !== location.origin || e.source !== els.frame.contentWindow) return;
    var d = e.data;
    if (!d || d.type !== "grill-submitted" || typeof d.topic !== "string") return;
    pendingSubmit[d.topic] = d.round;
    fetchState();
  });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") fetchState(); });
  setInterval(function () { if (document.visibilityState === "visible") fetchState(); }, POLL_MS);
  setInterval(renderList, 60000);  // 「n分前」を進める

  applyFilterUi();
  onHashChange();
  fetchState();
})();
</script>
<script>
  // ui-comments のボタンの初期位置。質問票の iframe の中にも同じボタンが右下にあるので、
  // 広い画面では上のバーの空き(更新時刻の左)、狭い画面では左下に置く。
  // 一覧に重なっていた旧い初期位置(v1)は一度だけ置き直す。ドラッグで動かした位置はそのまま使われる
  try {
    var key = "ui-comments:" + location.origin + ":grill-dashboard:pos";
    var seeded = key + ":seed";
    if (localStorage.getItem(seeded) !== "v2") {
      var pos = innerWidth >= 760
        ? { x: Math.max(0, innerWidth - 300), y: 0 }
        : { x: 16, y: Math.max(0, innerHeight - 150) };
      localStorage.setItem(key, JSON.stringify(pos));
      localStorage.setItem(seeded, "v2");
    }
  } catch (e) { /* 保存できなければ既定の位置 */ }
</script>
<script src="/ui-comments/overlay.js" data-project="grill-dashboard" defer></script>
</body>
